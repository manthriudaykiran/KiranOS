    <linearGradient id="kfRadiantCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#B9F5FF" />
      <stop offset="25%" stopColor="#00E5FF" />
      <stop offset="65%" stopColor="#0088FF" />
      <stop offset="100%" stopColor="#0044CC" />
